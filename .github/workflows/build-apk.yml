name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm install
      - run: npm run build

      - name: Tambah platform Android (jika belum ada)
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      # Ikon dan layar pembuka dibuat dari kode. Kalau langkah ini gagal, APK tetap dibangun dengan ikon bawaan.
      - name: Ikon dan layar pembuka
        continue-on-error: true
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install pillow
          /tmp/venv/bin/python scripts/android-assets.py android/app/src/main/res

      - name: Build APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: frocksmotion-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
