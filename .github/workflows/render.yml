name: Render Video

on:
  workflow_dispatch:
    inputs:
      quality:
        description: "Kualitas ekspor"
        type: choice
        default: "1080p"
        options:
          - "2K"
          - "1080p"
          - "720p"
      project:
        description: "Data proyek (JSON dari app). Kosongkan untuk contoh bawaan."
        default: ""

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npx remotion browser ensure

      - name: Render
        env:
          QUALITY: ${{ inputs.quality }}
          PROJECT: ${{ inputs.project }}
        run: |
          case "$QUALITY" in
            "2K") SCALE=1 ;;
            "1080p") SCALE=0.75 ;;
            "720p") SCALE=0.5 ;;
          esac
          mkdir -p out
          PROPS_ARG=""
          if [ -n "$(echo "$PROJECT" | tr -d '[:space:]')" ]; then
            node -e 'const fs=require("fs"); fs.writeFileSync("out/props.json", JSON.stringify({project: JSON.parse(process.env.PROJECT), scale: 1}));'
            PROPS_ARG="--props=out/props.json"
          fi
          npx remotion render src/remotion/index.ts Main out/video.mp4 --scale=$SCALE $PROPS_ARG

      - uses: actions/upload-artifact@v4
        with:
          name: frocksmotion-${{ inputs.quality }}
          path: out/video.mp4
